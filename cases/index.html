const SERVICE=["品牌設計包裝","公版套版客製"];
const ITEMS=["禮盒","提袋","外帶盒","紙箱","袋類","貼紙標籤","盒型結構","品牌識別"];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* hero: one at a time, slow */
(function(){
  const host=document.getElementById('slides'),now=document.getElementById('nowname');
  const list=CASES.filter(c=>c.o).slice(0,6);
  host.innerHTML=list.map((c,i)=>'<div class="slide'+(i===0?' on':'')+'"><img src="'+(c.o||c.cover)+'" alt="'+c.nm+'"'+(i>1?' loading="lazy"':'')+'></div>').join('');
  const sl=[...host.children],setName=i=>now.innerHTML='Selected Work<b>'+list[i].nm+'</b>';
  setName(0); if(reduce)return;
  let i=0;setInterval(()=>{sl[i].classList.remove('on');i=(i+1)%sl.length;sl[i].classList.add('on');setName(i);},6200);
})();

const grid=document.getElementById('grid'),countEl=document.getElementById('count');
const io=reduce?null:new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.05,rootMargin:'0px 0px -24px 0px'});
let active="全部";
try{const hf=decodeURIComponent((location.hash.match(/^#f=(.+)$/)||[])[1]||'');const sf=sessionStorage.getItem('sd_cases_f');const want=hf||sf||'';if(want&&(want==='全部'||CASES.some(c=>c.tags.includes(want))))active=want;}catch(e){}
const saveState=()=>{try{sessionStorage.setItem('sd_cases_f',active);sessionStorage.setItem('sd_cases_y',String(scrollY));history.replaceState(null,'',active==='全部'?location.pathname+location.search:'#f='+encodeURIComponent(active));}catch(e){}};
const countOf=t=>t==="全部"?CASES.length:CASES.filter(c=>c.tags.includes(t)).length;
const chip=(t,k)=>'<button class="chip '+k+'" data-tag="'+t+'" aria-pressed="'+(t===active)+'">'+t+' <span class="n">'+countOf(t)+'</span></button>';
function buildFilters(){
  document.getElementById('f-service').innerHTML=['全部'].concat(SERVICE).map(t=>chip(t,'tab')).join('');
  document.getElementById('f-item').innerHTML=ITEMS.map(t=>chip(t,'tg')).join('');
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    active=b.dataset.tag;
    document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tag===active));
    render();saveState();
  }));
}
function card(c){
  const tg=c.tags.filter(t=>!SERVICE.includes(t));
  const T=c.soon?'span':'a', H=c.soon?'':' href="./'+c.slug+'.html"';
  return '<'+T+' class="card reveal'+(c.soon?' soon':'')+'"'+H+'>'
    +'<img src="'+c.cover+'" alt="'+c.nm+' 包裝作品" width="600" height="600" loading="lazy" decoding="async">'
    +'<span class="meta"><span class="nm">'+c.nm+'<span>'+(c.kind||'')+'</span></span>'
    +(tg.length?'<span class="tg">'+tg.map(t=>'<span>'+t+'</span>').join('')+'</span>':'')
    +(c.items?'<span class="items">'+c.items+'</span>':'')+'</span></'+T+'>';
}
function observe(){const els=grid.querySelectorAll('.reveal:not(.in)');if(reduce){els.forEach(e=>e.classList.add('in'));return;}els.forEach((el,i)=>{el.style.transitionDelay=Math.min(i*35,300)+'ms';io.observe(el);});}
function render(){
  const arr=(active==="全部")?CASES.slice():CASES.filter(c=>c.tags.includes(active));
  countEl.textContent=(active==="全部"?'全部作品':active)+'　'+arr.length+' 件';
  if(!arr.length){grid.innerHTML='<div class="empty"><b>「'+active+'」的案例整理中</b>這個分類的實績即將補上，敬請期待。</div>';return;}
  grid.innerHTML=arr.map(card).join('');observe();
}
buildFilters();render();
(function(){let y=0;try{y=+sessionStorage.getItem('sd_cases_y')||0}catch(e){}
  const back=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0]||{}).type==='back_forward'||/^#f=/.test(location.hash);
  if(back&&y>0){if('scrollRestoration' in history)history.scrollRestoration='manual';grid.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));requestAnimationFrame(()=>scrollTo(0,y));setTimeout(()=>scrollTo(0,y),250);}
})();
grid.addEventListener('click',e=>{if(e.target.closest('a.card'))saveState();},true);
addEventListener('pagehide',saveState);
if(matchMedia('(hover: none)').matches){
  grid.addEventListener('click',e=>{
    const c=e.target.closest('.card');if(!c)return;
    if(c.classList.contains('show'))return;   // 第二下才進入內頁
    e.preventDefault();
    grid.querySelectorAll('.card.show').forEach(x=>x.classList.remove('show'));
    c.classList.add('show');
  });
}
</script>
