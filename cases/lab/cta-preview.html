<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTA preview</title><link rel="stylesheet" href="../sd-shell.css"><style>body{margin:0}
.sd-stockcta{background:#FBF8F3;border-top:1px solid #e8e2d9;padding:72px 0 78px}
.sd-stockcta .sc-eb{margin:0;font:600 12px/1 'Poppins',sans-serif;letter-spacing:3px;color:#9A8C78}
.sd-stockcta h2{margin:16px 0 0;font-family:'Noto Serif TC',serif;font-weight:700;color:#2E2A28;
  font-size:clamp(24px,3.6vw,40px);letter-spacing:1px;line-height:1.3}
.sd-stockcta .sc-lead{margin:16px 0 0;max-width:62ch;color:#6E675F;font-size:15px;line-height:1.9}
.sd-stockcta .sc-pts{list-style:none;margin:34px 0 0;padding:0;display:grid;gap:18px;
  grid-template-columns:repeat(3,1fr);border-top:1px solid #e8e2d9;padding-top:26px}
.sd-stockcta .sc-pts li{display:flex;flex-direction:column;gap:6px}
.sd-stockcta .sc-pts b{font-family:'Noto Serif TC',serif;font-size:19px;color:#2E2A28}
.sd-stockcta .sc-pts span{font-size:13.5px;color:#8C857C;line-height:1.7}
.sd-stockcta .sc-act{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.sd-stockcta .sc-act a{display:inline-block;text-decoration:none;font-weight:700;font-size:15px;
  padding:14px 30px;border-radius:999px;transition:transform .15s}
.sd-stockcta .sc-a1{background:#924898;color:#fff}
.sd-stockcta .sc-a2{background:transparent;color:#4A443D;border:1px solid #d8d1c7}
.sd-stockcta .sc-act a:hover{transform:translateY(-2px)}
@media(max-width:760px){.sd-stockcta{padding:54px 0 58px}
  .sd-stockcta .sc-pts{grid-template-columns:1fr;gap:16px}
  .sd-stockcta .sc-act a{flex:1 1 100%;text-align:center}}
</style></head><body><section class="sd-stockcta" id="line">
  <div class="container">
    <p class="sc-eb">STOCK STRUCTURE, YOUR OWN DESIGN</p>
    <h2>盒型用我們的，風格用你自己的。</h2>
    <p class="sc-lead">客製包裝，不一定要從零開始。選用薪鼎既有的公版盒型，套進自己的品牌設計，不必重新開刀模，也能做出有辨識度的專屬包裝。</p>
    <ul class="sc-pts">
      <li><b>免開刀模</b><span>省下開模費與打樣來回</span></li>
      <li><b>專屬設計</b><span>印刷、材質、加工依品牌調整</span></li>
      <li><b>成熟盒型</b><span>承重與裝箱已經量產驗證</span></li>
    </ul>
    <div class="sc-act">
      <a class="sc-a1" href="https://lin.ee/QzvYBN6" target="_blank" rel="noopener">LINE 諮詢公版客製</a>
      <a class="sc-a2" href="../">探索公版盒型 →</a>
    </div>
  </div>
</section></body></html>
