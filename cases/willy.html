<script>
(function(){
  var r=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els=document.querySelectorAll('.oreel img');
  if(r){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.05,rootMargin:'0px 0px -40px 0px'});
  els.forEach(function(e){io.observe(e)});
})();
</script>
